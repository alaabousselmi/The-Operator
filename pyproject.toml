[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "the-operator"
version = "0.1.0"
description = "Data pipeline repair agent (CS496 Project 3)"
requires-python = ">=3.10"
dependencies = [
    "langgraph==1.2.20",
    "langchain==1.4.10",
    "langchain-groq==1.1.3",
    "langgraph-checkpoint-sqlite==3.1.3",
    "pydantic==2.14.3",
    "PyYAML==6.0.3",
    "python-dotenv==1.2.4",
    "pytest==9.2.0",
]

[tool.setuptools]
packages = ["agent", "sandbox", "eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
